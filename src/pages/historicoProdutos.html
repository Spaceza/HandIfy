<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Histórico de Produtos - Handify</title>
    <link rel="stylesheet" href="../../src/css/historicoProdutos.css" />
    <link rel="shortcut icon" href="../images/favicon.ico" type="image/x-icon" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>


<body>
    <div class="container-principal">
        <header class="cabecalho">
            <img src="../images/logo-handify.png" alt="Logo Handify" class="logo" />
            <div class="linha-vertical"></div>
            <h2>Rastrear</h2>
            <button class="retorn"><i class="bi bi-box-arrow-in-left"></i></button>
        </header>
        
        <main>
            <section class="info-produto">
                <img id="imagem-produto" class="imagem-produto" src="" alt="Imagem do produto" />
                <div class="detalhes-produto">
                    <h3 id="nome-produto">Nome do Produto</h3>
                    <p id="descricao-produto" class="descricao"></p>
                </div>
            </section> 
        </main>
        <div class="cabecalho-rastreio">
            <span class="rotulo-numero-pedido">Número do Pedido:</span>
            <span id="numeroPedido" class="numeroPedido"></span>
            <button class="botao-copiar" onclick="copyOrderNumber()">Copiar</button>
        </div>
    </div> 
    
    
    <script src="../../src/js/historicoProduto/mobile-pop-up.js"></script>
    <script>
        document.getElementById('btn-voltar').addEventListener('click', function () {
            window.history.back();
        });
        </script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
